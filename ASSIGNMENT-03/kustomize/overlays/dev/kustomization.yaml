# DEV: 1 replica per tier, small DB disk, open CORS.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dso202-dev

resources:
  - ../../base

labels:
  - pairs:
      env: dev

patches:
  - target: { kind: Namespace, name: dso202-assignment-03 }
    patch: |-
      - op: replace
        path: /metadata/name
        value: dso202-dev
