apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: prod-
labels:
  - pairs:
      env: prod

# override this stage's replica count
patches:
  - target:
      kind: Deployment
      name: nginx
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5

# override the stage name in the ConfigMap
configMapGenerator:
  - name: nginx-config
    behavior: merge
    literals:
      - STAGE=prod

# copy spec.replicas from the Deployment into the ConfigMap
replacements:
  - source:
      kind: Deployment
      name: nginx
      fieldPath: spec.replicas
    targets:
      - select:
          kind: ConfigMap
          name: nginx-config
        fieldPaths:
          - data.REPLICAS