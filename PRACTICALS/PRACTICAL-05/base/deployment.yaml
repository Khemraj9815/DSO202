apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          env:
            # the official nginx image runs envsubst on /etc/nginx/templates/*.template
            # and writes the result (minus ".template") to this directory
            - name: NGINX_ENVSUBST_OUTPUT_DIR
              value: /usr/share/nginx/html
          envFrom:
            - configMapRef:
                name: nginx-config
          volumeMounts:
            - name: page-template
              mountPath: /etc/nginx/templates
      volumes:
        - name: page-template
          configMap:
            name: nginx-config
            items:
              - key: index.html.template
                path: index.html.template