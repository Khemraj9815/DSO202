# =============================================================================
# File        : frontend/service.yaml
# Practical   : DSO202 Practical 1
# Apply with  : kubectl apply -f frontend/service.yaml
# Purpose     : Exposes frontend UI externally using a local NodePort hook.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: dso202-assignment-01
  labels:
    dso202/assignment: "01"
    dso202/managed-by: declarative
  annotations:
    dso202.cst.edu.bt/description: "NodePort service layer for local browser entry"
spec:
  type: NodePort
  selector:
    tier: frontend
  ports:
    - protocol: TCP
      port: 80         # Port accessible internally inside cluster
      targetPort: 8080   # Port your container application listens on
      nodePort: 32080  # Fixed static port to visit from your host machine browser
